<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandesh Sharma — Building Something</title>
<meta name="description" content="sandesh.com.np is under construction. Follow along for updates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c121c;
    --bg-2: #0f1826;
    --grid-line: rgba(226,236,248,0.05);
    --grid-line-strong: rgba(226,236,248,0.10);
    --amber: #e8a33d;
    --amber-dim: #b97a24;
    --amber-soft: #f0b967;
    --ink: #eef2f6;
    --ink-dim: #8ea0b5;
    --rust: #c1502e;
    --fb-blue: #1877f2;
    --plate: #141d2b;
    --plate-line: #253347;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:64px 20px 40px;
  }

  /* blueprint backdrop */
  .grid-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
    background-position: -1px -1px;
    animation: drift 60s linear infinite;
  }
  .grid-vignette{
    position:fixed;
    inset:0;
    z-index:0;
    background: radial-gradient(ellipse at 50% 40%, rgba(12,18,28,0) 0%, rgba(12,18,28,0.75) 68%, var(--bg) 100%);
  }
  @keyframes drift{
    from{ background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px; }
    to{ background-position: -1px -121px, -121px -1px, -1px -121px, -121px -1px; }
  }

  /* corner crop marks */
  .crop{
    position:fixed;
    width:26px;
    height:26px;
    border-color: var(--grid-line-strong);
    z-index:1;
    pointer-events:none;
  }
  .crop.tl{ top:18px; left:18px; border-top:1px solid; border-left:1px solid; }
  .crop.tr{ top:18px; right:18px; border-top:1px solid; border-right:1px solid; }
  .crop.bl{ bottom:18px; left:18px; border-bottom:1px solid; border-left:1px solid; }
  .crop.br{ bottom:18px; right:18px; border-bottom:1px solid; border-right:1px solid; }

  header.tag{
    position:fixed;
    top:24px;
    left:34px;
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    z-index:2;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header.tag .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    animation: blink 1.6s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.15;} }

  .stamp{
    position:fixed;
    bottom:26px;
    right:30px;
    width:104px;
    height:104px;
    border:1px dashed var(--grid-line-strong);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform: rotate(-9deg);
    color:var(--ink-dim);
    z-index:2;
    line-height:1.5;
  }
  .stamp span{ display:block; font-size:9.5px; letter-spacing:0.12em; }
  .stamp span.mid{ color:var(--amber-soft); font-size:10.5px; margin:2px 0; }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:1040px;
  }

  .scene-wrap{
    width:100%;
    max-width:980px;
  }
  .scene{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }

  .brick{
    opacity:0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0.25);
    transition: opacity .22s ease-out, transform .22s cubic-bezier(.2,.9,.3,1.3);
  }
  .brick.on{ opacity:1; transform: scale(1); }

  .crane-line{ stroke:var(--ink-dim); stroke-width:3; opacity:0.85; }
  .crane-fill{ fill:var(--plate); stroke:var(--plate-line); stroke-width:2; }
  .hook{ stroke:var(--amber-soft); stroke-width:3; }

  .tagline{
    margin-top:6px;
    text-align:center;
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    font-weight:500;
    max-width:520px;
    line-height:1.6;
  }
  .tagline b{ color:var(--ink); font-weight:600; }

  /* ruler / progress */
  .ruler{
    margin-top:38px;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .ruler-track{
    position:relative;
    width:100%;
    height:10px;
    background:var(--plate);
    border:1px solid var(--plate-line);
    border-radius:2px;
  }
  .ruler-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    border-radius:2px;
  }
  .ruler-ticks{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-between;
  }
  .ruler-ticks i{
    width:1px;
    background:rgba(12,18,28,0.5);
    align-self:stretch;
  }
  .ruler-pointer{
    position:absolute;
    top:-26px;
    left:0%;
    transform:translateX(-50%);
    font-size:11px;
    color:var(--amber-soft);
    background:var(--plate);
    border:1px solid var(--plate-line);
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
  }
  .ruler-caption{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }

  /* hanging sign */
  .sign-anchor{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .bracket{
    width:34px; height:8px;
    border:1px solid var(--plate-line);
    border-bottom:none;
    border-radius:4px 4px 0 0;
    background:var(--plate);
  }
  .signboard{
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform-origin: top center;
    animation: swing 4.6s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce){
    .signboard{ animation:none; }
    .grid-bg{ animation:none; }
  }
  .signboard:hover{ animation-play-state: paused; }
  .chain{
    width:2px;
    height:30px;
    background-image: linear-gradient(var(--plate-line), var(--plate-line));
    background-size: 2px 6px;
    background-repeat: repeat-y;
    opacity:0.8;
  }
  .board{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 20px;
    background: linear-gradient(180deg, #182335, #121a27);
    border:1px solid var(--plate-line);
    border-radius:4px;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,0.6);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .signboard:hover .board{
    transform: translateY(-3px);
    border-color: var(--amber-dim);
    box-shadow: 0 18px 34px -12px rgba(0,0,0,0.7);
  }
  .board::before, .board::after{
    content:"";
    position:absolute;
    top:7px;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--plate-line);
  }
  .board::before{ left:7px; }
  .board::after{ right:7px; }
  .fb-badge{
    width:26px; height:26px;
    border-radius:50%;
    background:var(--fb-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .fb-badge svg{ width:14px; height:14px; }
  .board-text{
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:0.01em;
  }

  @keyframes swing{
    from{ transform: rotate(-4deg); }
    to{ transform: rotate(4deg); }
  }

  footer{
    position:relative;
    z-index:2;
    margin-top:44px;
    font-size:11px;
    color:var(--ink-dim);
    opacity:0.7;
    letter-spacing:0.02em;
  }

  a.signboard:focus-visible .board,
  a.signboard:focus-visible{
    outline:2px solid var(--amber-soft);
    outline-offset:4px;
  }

  @media (max-width:640px){
    header.tag{ left:18px; top:16px; font-size:11px; }
    .stamp{ width:80px; height:80px; right:16px; bottom:16px; }
    .stamp span{ font-size:8px; }
    .stamp span.mid{ font-size:9px; }
    .tagline{ font-size:14px; padding:0 8px; }
    .board-text{ font-size:12.5px; }
    body{ padding-top:80px; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="grid-vignette"></div>
  <div class="crop tl"></div>
  <div class="crop tr"></div>
  <div class="crop bl"></div>
  <div class="crop br"></div>

  <header class="tag"><span class="dot"></span>sandesh.com.np</header>

  <div class="stamp" aria-hidden="true">
    <span>SITE</span>
    <span class="mid">IN PROGRESS</span>
    <span>EST. 2026</span>
  </div>

  <main>
    <div class="scene-wrap">
      <svg class="scene" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sandesh Sharma — under construction">
        <defs>
          <mask id="nameMask">
            <rect x="0" y="0" width="1100" height="560" fill="black"/>
            <text x="550" y="220" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="140" letter-spacing="2" fill="white">SANDESH</text>
            <text x="550" y="380" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="140" letter-spacing="2" fill="white">SHARMA</text>
          </mask>
        </defs>

        <!-- crane -->
        <g id="crane">
          <line class="crane-line" x1="95" y1="470" x2="95" y2="70"></line>
          <line class="crane-line" x1="60" y1="470" x2="130" y2="470"></line>
          <line class="crane-line" x1="95" y1="70" x2="1010" y2="70"></line>
          <line class="crane-line" x1="95" y1="70" x2="60" y2="120"></line>
          <polygon class="crane-fill" points="60,120 40,120 60,470 60,120" opacity="0"></polygon>

          <g id="trolley">
            <rect class="crane-fill" x="-14" y="64" width="28" height="14" rx="2"></rect>
            <line class="hook" id="hookLine" x1="0" y1="78" x2="0" y2="230"></line>
            <g id="hookHead">
              <circle cx="0" cy="230" r="5" fill="none" class="hook"></circle>
            </g>
          </g>
        </g>

        <!-- bricks, revealed only where the mask (the name) is -->
        <g id="bricksGroup" mask="url(#nameMask)"></g>
      </svg>
    </div>

    <p class="tagline">This site is being put together brick by brick.<br>Come back soon to see <b>sandesh.com.np</b> in full.</p>

    <div class="ruler" aria-hidden="true">
      <div class="ruler-track">
        <div class="ruler-fill" id="rulerFill"></div>
        <div class="ruler-ticks" id="rulerTicks"></div>
        <div class="ruler-pointer" id="rulerPointer">0%</div>
      </div>
      <div class="ruler-caption">Site progress</div>
    </div>

    <div class="sign-anchor">
      <div class="bracket"></div>
      <a class="signboard" href="https://facebook.com/sandesheyy" target="_blank" rel="noopener noreferrer" aria-label="Follow Sandesh Sharma on Facebook">
        <span class="chain"></span>
        <span class="board">
          <span class="fb-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15.5 8.5H13.6c-.6 0-1.1.5-1.1 1.1v1.9h3l-.4 3h-2.6V22h-3v-7.5H7.2v-3h2.3V9.2C9.5 6.9 11 5.3 13.2 5.3h2.3v3.2Z" fill="white"/>
            </svg>
          </span>
          <span class="board-text">Follow along on Facebook</span>
        </span>
      </a>
    </div>
  </main>

  <footer>© 2026 Sandesh Sharma</footer>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const bricksGroup = document.getElementById("bricksGroup");
  const trolley = document.getElementById("trolley");
  const hookLine = document.getElementById("hookLine");
  const rulerFill = document.getElementById("rulerFill");
  const rulerPointer = document.getElementById("rulerPointer");
  const rulerTicks = document.getElementById("rulerTicks");

  // build ruler ticks
  for(let i=0;i<=20;i++){
    const t = document.createElement("i");
    rulerTicks.appendChild(t);
  }

  // build brick grid across the text bounding box; the SVG mask
  // clips everything to the letters, so we only ever see bricks
  // inside "SANDESH SHARMA".
  const boxX = 40, boxY = 60, boxW = 1020, boxH = 380;
  const bw = 24, bh = 18, gap = 4;
  const cols = Math.floor(boxW / (bw+gap));
  const rows = Math.floor(boxH / (bh+gap));

  const bricks = [];
  const minX = boxX, maxX = boxX + cols*(bw+gap);

  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const x = boxX + c*(bw+gap);
      const y = boxY + r*(bh+gap);
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", bw);
      rect.setAttribute("height", bh);
      rect.setAttribute("rx", 2);
      rect.setAttribute("class", "brick");
      rect.setAttribute("fill", r % 2 === 0 ? "#e8a33d" : "#c98a2e");
      bricksGroup.appendChild(rect);

      const norm = (x - minX) / (maxX - minX); // 0..1 left to right
      const threshold = Math.min(96, norm*88 + Math.random()*8);
      bricks.push({ el: rect, threshold, on:false });
    }
  }

  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function applyLevel(level){
    // bricks
    for(const b of bricks){
      const shouldShow = level >= b.threshold;
      if(shouldShow !== b.on){
        b.on = shouldShow;
        b.el.classList.toggle("on", shouldShow);
      }
    }
    // ruler
    rulerFill.style.width = level + "%";
    rulerPointer.style.left = level + "%";
    rulerPointer.textContent = Math.round(level) + "%";
    // crane trolley position follows level across the jib
    const tx = 130 + (level/100) * (970-130);
    trolley.setAttribute("transform", `translate(${tx},0)`);
  }

  if(prefersReduced){
    applyLevel(100);
    return;
  }

  const BUILD = 4200, HOLD = 1400, TEARDOWN = 1600, PAUSE = 500;
  const TOTAL = BUILD + HOLD + TEARDOWN + PAUSE;
  const start = performance.now();

  function frame(now){
    const t = (now - start) % TOTAL;
    let level;
    if(t < BUILD){
      level = (t / BUILD) * 100;
    } else if(t < BUILD+HOLD){
      level = 100;
    } else if(t < BUILD+HOLD+TEARDOWN){
      const tt = (t - BUILD - HOLD) / TEARDOWN;
      level = 100 - tt*100;
    } else {
      level = 0;
    }

    // gentle hook bob
    const bob = Math.sin(now/300) * 6;
    hookLine.setAttribute("y2", 230 + bob);

    applyLevel(level);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
